[project]
name = "kontura-ai"
version = "0.1.0"
description = "KI-gestützte Rechnungsverarbeitung und Auto-Buchung für SAP FI und DATEV"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Fabian Kipke" }
]
license = { text = "MIT" }
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "bcrypt>=4.2",
    "fastapi>=0.136.1",
    "greenlet>=3.4.0",
    "httpx>=0.28.1",
    "openai>=1.50",
    "pgvector>=0.3",
    "pydantic[email]>=2.13.3",
    "pydantic-settings>=2.14.0",
    "pyjwt>=2.10",
    "sqlalchemy[asyncio]>=2.0",
    "structlog>=25.5.0",
    "uvicorn[standard]>=0.46.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kontura"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Smoke-Tests rufen echte externe Services (OpenAI, Production-DB) auf.
# Standardlauf ueberspringt sie - manueller Aufruf:  uv run pytest -m smoke -v
addopts = "-m 'not smoke'"
markers = [
    "smoke: end-to-end smoke tests with real external services (OpenAI, Production-DB)",
]

[dependency-groups]
dev = [
    "mypy>=1.20.2",
    "psycopg[binary]>=3.2",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.11",
    "types-aiofiles>=25.1.0.20260409",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_any_unimported = false
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false