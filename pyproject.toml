[project]
name = "kontura-ai"
version = "0.1.0"
description = "KI-gestützte Rechnungsverarbeitung und Auto-Buchung für SAP FI und DATEV"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Fabian Kipke" }
]
license = { text = "MIT" }
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kontura"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]