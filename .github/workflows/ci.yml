# Continuous Integration - laeuft bei jedem Push + jedem PR auf main.
#
# Senior-Pattern: 3 parallele Jobs (lint / typecheck / test)
# ===========================================================
# - Schnelles Feedback: ruff (~30s) blockiert Devs nicht, wenn nur typecheck rot ist.
# - Test-Job nutzt echtes Postgres+pgvector (Service-Container), kein Mock.
# - uv-Cache via official action - spart ~2min pro Run.
#
# Senior-Detail: concurrency-Group
# =================================
# Wenn jemand 3 Commits hintereinander pusht, canceln wir alte Runs -
# sonst stehen 3 Pipelines in der Queue und blockieren sich gegenseitig.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Doppelte Runs vermeiden + alte Runs bei neuen Pushes canceln
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default: nur lesen. Einzelne Jobs koennen mehr Permissions anfordern.
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  UV_VERSION: "0.5.11"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Mypy
        run: uv run mypy src/ tests/

  test:
    name: Tests (pytest + Postgres)
    runs-on: ubuntu-latest

    # Service-Container: Postgres mit pgvector als Sidecar.
    # pgvector/pgvector:pg16 ist das offizielle Image mit pgvector preinstalled.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: kontura
          POSTGRES_PASSWORD: dev_local_password
          POSTGRES_DB: kontura
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Connection-String matched conftest.py / settings.database_url
      DATABASE_URL: postgresql+asyncpg://kontura:dev_local_password@localhost:5433/kontura
      # Rate-Limiting in CI aus (gleiche Logik wie lokal)
      RATE_LIMIT_ENABLED: "false"
      # Dummy JWT-Secret (32+ chars) - reicht fuer Tests
      JWT_SECRET: "ci-test-secret-do-not-use-in-production-please"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5433 -U kontura; then
              echo "Postgres is ready"; break
            fi
            echo "Waiting for Postgres... ($i/30)"
            sleep 1
          done

      - name: Run pytest
        run: uv run pytest --tb=short