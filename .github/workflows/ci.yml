# Continuous Integration - laeuft bei jedem Push + jedem PR auf main.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  UV_VERSION: "0.5.11"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Mypy
        run: uv run mypy src/ tests/

  test:
    name: Tests (pytest + Postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: kontura
          POSTGRES_PASSWORD: dev_local_password
          # WICHTIG: Test-DB heisst 'kontura_test' (siehe conftest.py).
          POSTGRES_DB: kontura_test
        ports:
          - 5433:5432
        # Healthcheck mit explizitem User -> kein 'role "root" does not exist'-Spam.
        options: >-
          --health-cmd "pg_isready -U kontura -d kontura_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Connection-String matched conftest.TEST_DATABASE_URL exakt.
      TEST_DATABASE_URL: postgresql+asyncpg://kontura:dev_local_password@localhost:5433/kontura_test
      # Kontura-App-DB (falls Tests sie indirekt anfassen) auf gleiche Test-DB,
      # damit nichts auf 'kontura' (das es im CI nicht gibt) versucht zu connecten.
      DATABASE_URL: postgresql+asyncpg://kontura:dev_local_password@localhost:5433/kontura_test
      # Rate-Limiting in CI aus (gleiche Logik wie lokal).
      RATE_LIMIT_ENABLED: "false"
      # Dummy JWT-Secret (32+ chars) - nur fuer CI.
      JWT_SECRET: "ci-test-secret-do-not-use-in-production-please"
      OPENAI_API_KEY: "test-key-dummy-not-real"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5433 -U kontura -d kontura_test; then
              echo "Postgres is ready"; break
            fi
            echo "Waiting for Postgres... ($i/30)"
            sleep 1
          done

      - name: Run pytest
        run: uv run pytest --tb=short