# Continuous Integration - laeuft bei jedem Push + jedem PR auf main.
#
# Architektur:
# ============
# Backend  : lint (ruff) | typecheck (mypy) | test (pytest+pg)
# Frontend : lint (eslint) | typecheck (tsc) | build (next)

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  UV_VERSION: "0.5.11"
  NODE_VERSION: "20"

jobs:
  # ============================================================
  # Backend
  # ============================================================

  backend-lint:
    name: Backend Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install Python
        run: uv python install ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: uv sync --frozen
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Ruff lint
        run: uv run ruff check .

  backend-typecheck:
    name: Backend Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install Python
        run: uv python install ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: uv sync --frozen
      - name: Mypy
        run: uv run mypy src/ tests/

  backend-test:
    name: Backend Tests (pytest + Postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: kontura
          POSTGRES_PASSWORD: dev_local_password
          POSTGRES_DB: kontura_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U kontura -d kontura_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://kontura:dev_local_password@localhost:5433/kontura_test
      DATABASE_URL: postgresql+asyncpg://kontura:dev_local_password@localhost:5433/kontura_test
      RATE_LIMIT_ENABLED: "false"
      JWT_SECRET: "ci-test-secret-do-not-use-in-production-please"
      OPENAI_API_KEY: "test-key-dummy-not-real"

    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install Python
        run: uv python install ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: uv sync --frozen
      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5433 -U kontura -d kontura_test; then
              echo "Postgres is ready"; break
            fi
            echo "Waiting for Postgres... ($i/30)"
            sleep 1
          done
      - name: Run pytest
        run: uv run pytest --tb=short

  # ============================================================
  # Frontend
  # ============================================================

  frontend-lint:
    name: Frontend Lint (eslint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint

  frontend-typecheck:
    name: Frontend Type Check (tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run typecheck

  frontend-build:
    name: Frontend Build (next)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # Dummy-Env-Vars - config.ts validiert sie als pflicht.
      # Echtes Deploy bekommt eigene Werte in Phase G2.4.
      NEXT_PUBLIC_API_BASE_URL: "http://localhost:8000"
      API_BASE_URL: "http://localhost:8000"
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build